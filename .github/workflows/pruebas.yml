# Pruebas automáticas antes de publicar.
# 1) En cada cambio: comprueba sintaxis, versiones, cálculos clave, todas las pantallas (ordenador y móvil),
#    flujos de uso, la tarea de precios y el SQL completo en una base PostgreSQL de prueba.
# 2) Solo si todo pasa, publica la app en GitHub Pages.
#    Requisito (una vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Pruebas y publicación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pruebas
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_DSN: postgresql://postgres:pruebas@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas de prueba
        run: |
          pip install pytest==9.* playwright==1.63.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y postgresql-client >/dev/null
      - name: Ejecutar pruebas
        run: python -m pytest tests -q

  publicar:
    needs: pruebas
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar los archivos de la web
        run: |
          mkdir _site
          cp -r index.html manifest.json sw.js css js icons sql README.md CHANGELOG.md _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
