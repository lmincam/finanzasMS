# En cada cambio, a la vez:
# · publicar: sube la app a GitHub Pages (menos de 1 minuto; no espera a las pruebas, que ya se pasan antes de subir).
# · pruebas: sintaxis, versiones, cálculos, pantallas, flujos, tarea de precios y SQL en PostgreSQL.
#   Sin apt-get (los servidores de Ubuntu fallaban y lo hacían lento): el navegador va en caché.
#    Requisito (una vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Pruebas y publicación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pruebas
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_DSN: postgresql://postgres:pruebas@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/pruebas.yml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium
      - name: Instalar herramientas de prueba
        run: |
          pip install pytest==9.* playwright==1.63.0
          python -m playwright install chromium
          command -v psql >/dev/null || sudo apt-get install -y postgresql-client >/dev/null
      - name: Ejecutar pruebas
        run: python -m pytest tests -q

  # Dos trabajos: preparar sube la web y desplegar la publica. Separados, GitHub ya tiene el paquete
  # registrado cuando se despliega (en un solo trabajo a veces no lo encontraba: "No artifacts named github-pages").
  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar los archivos de la web
        run: |
          mkdir _site
          cp -r index.html manifest.json sw.js css js icons sql README.md CHANGELOG.md _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  desplegar:
    needs: publicar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Esperar a que el paquete esté disponible
        run: sleep 10
      - id: deploy
        uses: actions/deploy-pages@v5
