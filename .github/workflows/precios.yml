# Precios diarios de los ISIN de tus productos de inversión → Supabase (tabla "precios").
# Configura los secretos en GitHub: Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_URL                 (la Project URL de Supabase)
#   SUPABASE_SERVICE_ROLE_KEY    (Supabase → Project Settings → API Keys → service_role / secret)
#   EODHD_API_KEY                (opcional pero recomendado: eodhd.com, plan gratuito)
name: Precios diarios

on:
  schedule:
    - cron: '45 20 * * 1-5'   # 21:45 / 22:45 en España: cierre de bolsa (ETF y acciones)
    - cron: '15 7 * * 2-6'    # 08:15 / 09:15 en España: los fondos publican el valor liquidativo al día siguiente
  workflow_dispatch: {}       # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: read

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Descargar y guardar precios
        run: node scripts/precios.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
