<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Patrimonio Familiar · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="css/estilos.css?v=3.0.0">
</head>
<body>
<div class="sticky">
  <header class="topbar">
    <div class="logo">€</div>
    <div class="brand">Patrimonio Familiar<small>Dashboard ejecutivo · <span id="app-version"></span></small></div>
    <div class="sp"></div>
    <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-txt">Sin conectar</span></div>
    <button class="icon-btn" data-action="refresh" title="Recargar datos">⟳</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
</div>

<main id="main">
  <section class="tab" id="tab-dashboard"></section>
  <section class="tab" id="tab-cuentas"></section>
  <section class="tab" id="tab-patrimonio"></section>
  <section class="tab" id="tab-inversiones"></section>
  <section class="tab" id="tab-deudas"></section>
  <section class="tab" id="tab-auditoria"></section>
  <section class="tab" id="tab-categorias"></section>
  <section class="tab" id="tab-ajustes"></section>
</main>

<button class="fab" data-action="quick-open" data-tipo="gasto" title="Registro rápido">+</button>
<div id="modal-root"></div>
<div id="toasts"></div>
<div id="loader" class="loader hidden"><div class="spinner"></div><div id="loader-txt">Cargando…</div></div>

<!-- Módulos de la app: el ORDEN importa (cada uno usa lo definido en los anteriores).
     Al publicar una versión nueva, cambia ?v= en todos para que los navegadores no usen la copia antigua. -->
<script src="js/config.js?v=3.0.0"></script>
<script src="js/utilidades.js?v=3.0.0"></script>
<script src="js/estado.js?v=3.0.0"></script>
<script src="js/datos.js?v=3.0.0"></script>
<script src="js/calculos.js?v=3.0.0"></script>
<script src="js/ui.js?v=3.0.0"></script>
<script src="js/graficos.js?v=3.0.0"></script>
<script src="js/alertas.js?v=3.0.0"></script>
<script src="js/dashboard.js?v=3.0.0"></script>
<script src="js/cuentas.js?v=3.0.0"></script>
<script src="js/importador.js?v=3.0.0"></script>
<script src="js/inversiones.js?v=3.0.0"></script>
<script src="js/inmuebles.js?v=3.0.0"></script>
<script src="js/deudas.js?v=3.0.0"></script>
<script src="js/auditoria.js?v=3.0.0"></script>
<script src="js/categorias.js?v=3.0.0"></script>
<script src="js/ajustes.js?v=3.0.0"></script>
<script src="js/app.js?v=3.0.0"></script>
</body>
</html>
