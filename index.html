<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Patrimonio Familiar · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#0f1f3a;--navy2:#172a4d;--navy3:#22396a;--slate:#475569;--muted:#64748b;--line:#e2e8f0;--line2:#cbd5e1;
  --bg:#f1f5f9;--card:#fff;--txt:#0f172a;
  --green:#15803d;--green-bg:#dcfce7;--red:#b91c1c;--red-bg:#fee2e2;--amber:#b45309;--amber-bg:#fef3c7;--blue:#1d4ed8;--blue-bg:#dbeafe;
  --radius:14px;--shadow:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:20px}h3{font-size:16px}
a{color:var(--blue)}
.sticky{position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.topbar{background:var(--navy);color:#fff;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#22c55e,#15803d);display:grid;place-items:center;font-weight:700;font-size:18px}
.brand{font-weight:700;font-size:16px;line-height:1.15}
.brand small{display:block;font-weight:500;font-size:10.5px;opacity:.6;letter-spacing:.08em;text-transform:uppercase}
.sp{flex:1}
.conn{font-size:12px;display:flex;align-items:center;gap:6px;opacity:.9}
.dot{width:8px;height:8px;border-radius:50%;background:#94a3b8;display:inline-block}
.dot.ok{background:#22c55e}.dot.err{background:#ef4444}.dot.busy{background:#f59e0b}
.icon-btn{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;padding:8px 11px;cursor:pointer;font-size:15px}
.icon-btn:hover{background:rgba(255,255,255,.18)}
.tabs{background:var(--navy2);display:flex;overflow-x:auto;gap:2px;padding:0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:#a9b8d0;padding:12px 13px 10px;font:inherit;font-weight:500;font-size:13.5px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
.tabs button:hover{color:#fff}
.tabs button.active{color:#fff;border-bottom-color:#22c55e}
main{max-width:1280px;margin:0 auto;padding:18px}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:1px solid rgba(15,23,42,.04)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head .sub{color:var(--muted);font-size:12.5px;font-weight:400}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.grid-2e{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;border-left:4px solid var(--navy3)}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .v{font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.pos{border-left-color:#16a34a}.kpi.neg{border-left-color:#dc2626}.kpi.warn{border-left-color:#d97706}.kpi.navy{border-left-color:var(--navy);background:linear-gradient(180deg,#fff,#f8fafc)}
.pos{color:var(--green)}.neg{color:var(--red)}.warn-t{color:var(--amber)}.muted{color:var(--muted)}.small{font-size:12.5px}.right{text-align:right}.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{border:1px solid var(--line2);background:#fff;color:var(--txt);padding:9px 14px;border-radius:10px;font:inherit;font-weight:500;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f8fafc}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.primary:hover{background:var(--navy3)}
.btn.success{background:#15803d;border-color:#15803d;color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.6;cursor:wait}
.mini{border:0;background:#f1f5f9;border-radius:8px;padding:5px 8px;cursor:pointer;font-size:13px;line-height:1}
.mini:hover{background:#e2e8f0}
label{display:block;font-size:12.5px;font-weight:600;color:var(--slate);margin-bottom:5px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:10px;font:inherit;font-size:14px;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:2px solid #93c5fd;border-color:#60a5fa}
input[type=checkbox]{width:auto}
input[type=color]{padding:3px;height:40px}
textarea{min-height:70px;resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.hint{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--txt);font-size:14px;margin-top:22px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.seg{display:inline-flex;background:#e2e8f0;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--slate)}
.seg button.active{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.period{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.period .pin{display:flex;align-items:center;gap:6px}
.period .pin input{width:150px}
.period-label{font-weight:600;color:var(--navy)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:#e2e8f0;color:var(--slate);white-space:nowrap}
.badge.green{background:var(--green-bg);color:var(--green)}.badge.red{background:var(--red-bg);color:var(--red)}.badge.amber{background:var(--amber-bg);color:var(--amber)}.badge.blue{background:var(--blue-bg);color:var(--blue)}.badge.navy{background:var(--navy);color:#fff}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:6px;background:#f1f5f9;color:var(--slate)}
.chip.t{background:#ede9fe;color:#5b21b6}
.chart-box{position:relative;height:290px}
.chart-box.sm{height:240px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl tr.sub td:first-child{padding-left:26px;color:var(--slate)}
.tbl tr.root td{font-weight:600}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar{height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden;min-width:80px}
.bar>span{display:block;height:100%;border-radius:99px;background:#16a34a}
.bar.amber>span{background:#d97706}.bar.red>span{background:#dc2626}.bar.navy>span{background:var(--navy3)}
.cdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.acc-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;border-top:4px solid var(--acc,#1e3a5f);display:flex;flex-direction:column;gap:6px}
.acc-card.off{opacity:.55}
.acc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.acc-name{font-weight:600}
.acc-sub,.acc-meta{font-size:12px;color:var(--muted)}
.acc-val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.acc-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.mov-filters{display:grid;grid-template-columns:170px 1fr 1fr 2fr auto;gap:8px;margin-bottom:12px}
.mov-row{display:grid;grid-template-columns:58px 1fr auto auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid #f1f5f9}
.mov-date{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mov-concept{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.mov-meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;align-items:center}
.mov-amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.mov-act{display:flex;gap:4px}
.imp-row{display:grid;grid-template-columns:26px 82px minmax(160px,1.6fr) 100px 140px minmax(170px,1.3fr) 130px;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid #f1f5f9}
.imp-row.dup{background:#fff7ed}
.imp-row.off{opacity:.5}
.imp-row input,.imp-row select{padding:6px 8px;font-size:13px}
.imp-row .flags{grid-column:3/-1;display:flex;gap:6px;flex-wrap:wrap}
.imp-row .tsel{display:flex;gap:6px}
.imp-head{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:#f8fafc;border-radius:8px}
.imp-summary{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:10px 12px;background:#f8fafc;border-radius:10px;margin-bottom:10px;font-size:13.5px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:10px 0}
.cat-row{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid #f1f5f9}
.cat-row.lvl1{padding-left:28px}
.cat-row .cname{flex:1}
.cat-row.lvl0 .cname{font-weight:600}
.cat-row .cbud{font-size:13px;color:var(--slate);font-variant-numeric:tabular-nums}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.metric{background:#f8fafc;border-radius:10px;padding:10px 12px}
.metric .l{font-size:11.5px;color:var(--muted);font-weight:500}
.metric .v{font-size:16px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub-title{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:14px 0 8px}
.asset-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.asset-ico{width:42px;height:42px;border-radius:12px;background:#eef2ff;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.notes{white-space:pre-wrap;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.banner{padding:12px 14px;border-radius:12px;margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.amber{background:var(--amber-bg);color:#78350f}.banner.blue{background:var(--blue-bg);color:#1e3a8a}.banner.red{background:var(--red-bg);color:#7f1d1d}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:14px}
.top-list .it{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13.5px}
.top-list .it .c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brk{display:flex;flex-direction:column;gap:9px}
.brk .r{display:grid;grid-template-columns:120px 1fr 120px;gap:10px;align-items:center;font-size:13.5px}
details summary{cursor:pointer;font-weight:600;color:var(--navy);padding:8px 0}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:#16a34a;color:#fff;font-size:30px;box-shadow:0 8px 22px rgba(22,163,74,.45);cursor:pointer;z-index:35}
.fab:hover{background:#15803d}
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:22px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin-bottom:14px;padding-right:30px}
.modal-x{position:absolute;right:12px;top:10px;border:0;background:#f1f5f9;border-radius:50%;width:32px;height:32px;font-size:20px;cursor:pointer;line-height:1}
input.big{font-size:26px;font-weight:700;padding:12px;text-align:right}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:460px}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .2s;pointer-events:auto}
.toast.ok{background:#15803d}.toast.err{background:#b91c1c}.toast.warn{background:#b45309}
.loader{position:fixed;inset:0;background:rgba(241,245,249,.75);backdrop-filter:blur(2px);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:500;color:var(--navy)}
.loader.hidden{display:none}
.spinner{width:42px;height:42px;border:4px solid #cbd5e1;border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
.btn:not(.primary):not(.success):not(.danger) .spin{border-color:#cbd5e1;border-top-color:var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:11px 13px;border-radius:12px;border-left:4px solid;font-size:13.5px;line-height:1.45}
.alert .ic{font-size:18px;line-height:1.2}
.alert b.t{display:block;font-size:14px;margin-bottom:2px}
.alert.red{background:#fef2f2;border-color:#dc2626}.alert.amber{background:#fffbeb;border-color:#d97706}
.alert.blue{background:#eff6ff;border-color:#2563eb}.alert.green{background:#f0fdf4;border-color:#16a34a}
.alert ul{margin:4px 0 0;padding-left:18px}
.inv-card{border-top:4px solid var(--acc,#7c3aed)}
code{background:#f1f5f9;padding:1px 6px;border-radius:5px;font-size:12.5px}
@media (max-width:900px){
  .grid-2,.grid-2e{grid-template-columns:1fr}
  .mov-filters{grid-template-columns:1fr 1fr}
  .mov-filters .q{grid-column:1/-1}
  .imp-row{grid-template-columns:26px 1fr auto;row-gap:6px}
  .imp-row .c-concept{grid-column:2/-1}
  .imp-row .c-tipo,.imp-row .c-cat,.imp-row .c-mes{grid-column:2/-1}
  .imp-row .flags{grid-column:2/-1}
  .imp-head{display:none}
}
@media (max-width:640px){
  main{padding:12px}
  .card{padding:14px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .v{font-size:18px}
  .form-grid{grid-template-columns:1fr}
  input,select,textarea{font-size:16px}
  .modal-back{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:94vh;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .brand small,.conn span:last-child{display:none}
  .brk .r{grid-template-columns:95px 1fr 100px}
  .chart-box{height:250px}
  .mov-row{grid-template-columns:44px 1fr auto}
  .mov-act{grid-column:2/-1;justify-content:flex-end}
  .period .pin input{width:135px}
}
</style>
</head>
<body>
<div class="sticky">
  <header class="topbar">
    <div class="logo">€</div>
    <div class="brand">Patrimonio Familiar<small>Dashboard ejecutivo</small></div>
    <div class="sp"></div>
    <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-txt">Sin conectar</span></div>
    <button class="icon-btn" data-action="refresh" title="Recargar datos">⟳</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
</div>

<main id="main">
  <section class="tab" id="tab-dashboard"></section>
  <section class="tab" id="tab-cuentas"></section>
  <section class="tab" id="tab-patrimonio"></section>
  <section class="tab" id="tab-inversiones"></section>
  <section class="tab" id="tab-deudas"></section>
  <section class="tab" id="tab-auditoria"></section>
  <section class="tab" id="tab-categorias"></section>
  <section class="tab" id="tab-ajustes"></section>
</main>

<button class="fab" data-action="quick-open" data-tipo="gasto" title="Registro rápido">+</button>
<div id="modal-root"></div>
<div id="toasts"></div>
<div id="loader" class="loader hidden"><div class="spinner"></div><div id="loader-txt">Cargando…</div></div>

<script>
'use strict';
/* =====================================================================
   1. CONFIGURACIÓN SUPABASE
   ---------------------------------------------------------------------
   Opción A: pega aquí tu Project URL y tu clave anon/publishable.
   Opción B (recomendada si el repositorio de GitHub es público):
             déjalas vacías y configúralas en la pestaña ⚙️ Ajustes;
             se guardan solo en el localStorage de cada dispositivo.
   ===================================================================== */
const SUPABASE_URL      = '';   // ej: 'https://abcdefghijk.supabase.co'
const SUPABASE_ANON_KEY = '';   // ej: 'eyJhbGciOi...' o 'sb_publishable_...'

/* =====================================================================
   2. UTILIDADES GENERALES
   ===================================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const FAIL = Symbol('fail');
const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const round2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const byOrden = (a, b) => (num(a.orden) - num(b.orden)) || String(a.nombre).localeCompare(String(b.nombre), 'es');

/** Convierte "1.250,50 €", "-12,3", 1250.5, "(45,00)" → número. Vacío → null. */
function parseNum(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return v;
  let s = String(v).trim().replace(/[€\s ]/g, '');
  if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.endsWith('-')) { neg = true; s = s.slice(0, -1); }
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^[-+]?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  if (isNaN(n)) return NaN;
  return neg ? -n : n;
}
const num = v => { const n = parseNum(v); return (n === null || isNaN(n)) ? 0 : n; };
const sum = (arr, f) => arr.reduce((a, x) => a + num(typeof f === 'function' ? f(x) : (f ? x[f] : x)), 0);

  for (let k = d + 1; k <= dim; k++) { const wd = new Date(y, m - 1, k).getDay(); if (wd !== 0 && wd !== 6) c++; }

function parseDateAny(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number' && v > 20000 && v < 80000) {
    const d = new Date(Math.round((v - 25569) * 86400000));
    return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
  }
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}`;
  const s = String(v).trim();
  let y, mo, d, m;

}

/* ---------- Préstamos: sistema francés ---------- */
const cuotaFrancesa = (P, r, n) => n > 0 ? (r === 0 ? P / n : P * r / (1 - Math.pow(1 + r, -n))) : 0;
function amortizar(P, r, cuota, startYm) {
  const out = []; let p = P, ym = startYm;
  if (!(cuota > 0) || p <= 0.005) return out;
  if (r > 0 && cuota <= p * r + 1e-9) return null; // la cuota no cubre intereses
  while (p > 0.005 && out.length < 720) {
    const int = p * r; const cap = Math.min(cuota - int, p);
    p -= cap; out.push({ ym, cuota: cap + int, interes: int, capital: cap, pendiente: Math.max(0, p) });
    ym = addMonths(ym, 1);
  }
  return out;
}
function deudaInfo(d) {
  if (_deudaCache.has(d.id)) return _deudaCache.get(d.id);
  const today = todayISO();
  const r = num(d.interes) / 100 / 12;
  const pagadas = d.fecha_inicio ? Math.max(0, monthsDiff(d.fecha_inicio, today)) : null;
  const restContrato = d.plazo_meses ? Math.max(0, num(d.plazo_meses) - (pagadas || 0)) : null;
  const tienePend = d.capital_pendiente !== null && d.capital_pendiente !== undefined && d.capital_pendiente !== '';
  let P0, refDate;
  if (tienePend) { P0 = num(d.capital_pendiente); refDate = d.fecha_capital_pendiente || today; }
  else if (num(d.capital_inicial) > 0 && d.fecha_inicio) { P0 = num(d.capital_inicial); refDate = d.fecha_inicio; }
  else { P0 = num(d.capital_inicial); refDate = today; }
  let cuota = num(d.cuota_mensual);
  if (!cuota) {
    if (tienePend && restContrato) cuota = cuotaFrancesa(P0, r, restContrato);
    else if (num(d.capital_inicial) > 0 && d.plazo_meses) cuota = cuotaFrancesa(num(d.capital_inicial), r, num(d.plazo_meses));
  }
  const meses = Math.max(0, monthsDiff(refDate, today));
  let P = P0;
  for (let i = 0; i < meses && P > 0; i++) P = Math.max(0, P - Math.max(0, cuota - P * r));
  P = round2(P);
  const sched = amortizar(P, r, cuota, addMonths(ymOf(today), 1));
  const s = sched || [];
  const info = {
    r, cuota, pendienteHoy: P, pagadas, restContrato, viable: sched !== null,
    restantes: sched ? s.length : null, fin: s.length ? s[s.length - 1].ym : null,
    interesesPendientes: sum(s, 'interes'), sched: s, estimado: meses > 0,
    pctAmort: num(d.capital_inicial) > 0 ? Math.max(0, 1 - P / num(d.capital_inicial)) : null
  };
  _deudaCache.set(d.id, info);
  return info;
}
function inmuebleInfo(i) {
  const coste = num(i.precio_compra) + num(i.gastos_adquisicion);
  const vm = num(i.valor_mercado);
  const debts = S.deudas.filter(d => d.inmueble_id === i.id && d.activa !== false);
  const deuda = sum(debts, d => deudaInfo(d).pendienteHoy);
  const cuota = sum(debts, d => deudaInfo(d).cuota);
  const renta = num(i.renta_mensual);
  const rentaAnual = renta * Math.max(0, 12 - num(i.meses_vacio));
  const gastos = num(i.gastos_ibi) + num(i.gastos_comunidad) + num(i.gastos_seguro) + num(i.gastos_mantenimiento);
  const netoAnual = rentaAnual - gastos;
  return {
    coste, vm, plusvalia: vm - coste, plusPct: coste ? (vm - coste) / coste : null, deuda, neto: vm - deuda, ltv: vm ? deuda / vm : null,
    renta, rentaAnual, gastos, netoAnual, cuota,
    brutaVM: vm ? renta * 12 / vm : null, brutaCoste: coste ? renta * 12 / coste : null,
    netaVM: vm ? netoAnual / vm : null, netaCoste: coste ? netoAnual / coste : null,
    cashflow: renta ? netoAnual / 12 - cuota : null
  };
}

/* ---------- Periodo del dashboard ---------- */
function periodMonths() {
  const p = S.period;
  switch (p.mode) {
    case '2m': case '3m': case '6m': { const n = parseInt(p.mode, 10); return Array.from({ length: n }, (_, i) => addMonths(p.ref, i - n + 1)); }
    case 'anio': { const y = p.ref.slice(0, 4); return Array.from({ length: 12 }, (_, i) => `${y}-${pad(i + 1)}`); }
    case 'custom': return monthsBetween(p.from || p.ref, p.to || p.ref);
    default: return [p.ref];
  }
}
function periodStats(months) {
  const set = new Set(months);
  const movs = S.movimientos.filter(m => set.has(ymOf(m.mes_imputacion)));
  const ingresos = sum(movs.filter(m => m.tipo === 'ingreso'), 'importe');
  const gastos = -sum(movs.filter(m => m.tipo === 'gasto'), 'importe');
  // Transferencias: se toma la pata positiva de cada pareja. Si entra en cuenta de inversión/ahorro suma; si vuelve a operativa, resta (retirada).
  const aport = { liquidez: 0, ahorro: 0, inversion: 0 };
  for (const m of movs) {
    if (m.tipo !== 'transferencia' || num(m.importe) <= 0) continue;
    const st = m.subtipo_transferencia || 'liquidez';
    const c = cuentaById(m.cuenta_id);
    if (st === 'liquidez') aport.liquidez += num(m.importe);
    else aport[st] += (c && (c.tipo === 'inversion' || c.tipo === 'ahorro')) ? num(m.importe) : -num(m.importe);
  }
  return { movs, ingresos, gastos, ahorro: ingresos - gastos, aport };
}

    case 'rawselect': input = `<select id="${id}" name="${f.name}">${f.html(v)}</select>`; break;
    case 'textarea': input = `<textarea id="${id}" name="${f.name}" placeholder="${esc(f.ph || '')}">${esc(v ?? '')}</textarea>`; break;
    case 'checkbox': input = `<label class="chk"><input type="checkbox" id="${id}" name="${f.name}" ${v === false ? '' : (v || f.def) ? 'checked' : ''}> ${esc(f.label)}</label>`; break;
    case 'number': input = `<input id="${id}" name="${f.name}" inputmode="decimal" autocomplete="off" value="${esc(numInput(v))}" placeholder="${esc(f.ph || '0,00')}">`; break;
    case 'int': input = `<input id="${id}" name="${f.name}" type="number" step="1" inputmode="numeric" value="${esc(v ?? '')}">`; break;
    default: input = `<input id="${id}" name="${f.name}" type="${f.type || 'text'}" value="${esc(v ?? (f.type === 'color' ? '#1e3a5f' : ''))}" placeholder="${esc(f.ph || '')}" autocomplete="off">`;
  }
  return `<div class="${f.full ? 'full ' : ''}${f.cls || ''}">${f.type === 'checkbox' ? '' : `<label for="${id}">${esc(f.label)}${f.required ? ' *' : ''}</label>`}${input}${f.hint ? `<small class="hint">${f.hint}</small>` : ''}</div>`;
}
function collect(form, fields) {
  const o = {};
  for (const f of fields) {
    const el = form.elements[f.name]; if (!el) continue;
    if (f.type === 'checkbox') o[f.name] = el.checked;
    else if (f.type === 'number') { const n = parseNum(el.value); o[f.name] = (n === null || isNaN(n)) ? null : round2(n); }
    else if (f.type === 'int') o[f.name] = el.value === '' ? null : parseInt(el.value, 10);
    else o[f.name] = el.value.trim() === '' ? null : el.value.trim();
  }
  return o;
}
function openForm({ title, fields, values = {}, submitLabel = 'Guardar', onSubmit, intro = '', onMount }) {
  const m = modal(`<h3>${esc(title)}</h3>${intro}<form class="form-grid" novalidate>${fields.map(f => fieldHtml(f, values[f.name])).join('')}
    <div class="full actions"><button type="button" class="btn ghost" data-close>Cancelar</button><button type="submit" class="btn primary">${submitLabel}</button></div></form>`);
  const form = m.el.querySelector('form');
  m.el.querySelector('[data-close]').addEventListener('click', m.close);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const vals = collect(form, fields);
    for (const f of fields) {
      if (f.required && (vals[f.name] === null || vals[f.name] === '')) { toast(`Falta el campo: ${f.label}`, 'warn'); return; }
      if (f.type === 'number' && form.elements[f.name] && form.elements[f.name].value.trim() !== '' && vals[f.name] === null) { toast(`Número no válido en: ${f.label}`, 'warn'); return; }
    }
    const r = await withSaving(form.querySelector('[type=submit]'), () => onSubmit(vals, form));
    if (r !== FAIL) { m.close(); render(); }
  });
  if (onMount) onMount(form, m);
  return m;
}

function budgetRows(gastosMov, nM) {
  const spentBy = {};
  const known = new Set(S.categorias.filter(c => c.tipo === 'gasto').map(c => c.id));
  for (const m of gastosMov) { const k = (m.categoria_id && known.has(m.categoria_id)) ? m.categoria_id : '_none'; spentBy[k] = (spentBy[k] || 0) - num(m.importe); }
  const rows = [];
  for (const r of S.categorias.filter(c => c.tipo === 'gasto' && !c.parent_id).sort(byOrden)) {
    const ch = childrenOf(r.id);
    const spent = (spentBy[r.id] || 0) + sum(ch, c => spentBy[c.id] || 0);
    const bud = budgetOf(r) * nM;
    if (!spent && !bud) continue;
    rows.push({ lvl: 0, nombre: r.nombre, color: r.color || '#94a3b8', spent, bud, own: num(r.presupuesto_mensual) > 0, catId: r.id });
    for (const c of ch) { const s = spentBy[c.id] || 0, b = num(c.presupuesto_mensual) * nM; if (s || b) rows.push({ lvl: 1, nombre: c.nombre, color: c.color || r.color || '#cbd5e1', spent: s, bud: b, own: true, catId: c.id }); }
  }
  if (spentBy._none) rows.push({ lvl: 0, nombre: 'Sin categoría', color: '#94a3b8', spent: spentBy._none, bud: 0 });
  return rows;
}

function movRow(m) {

      <button class="mini" data-action="mov-del" data-id="${m.id}" title="Eliminar">🗑</button>
    </div></div>`;
}

/* ---------- Guardado de movimientos (incluye parejas de transferencia) ---------- */
async function guardarMovimiento(d, orig) {
  const isT = d.tipo === 'transferencia';
  if (!d.cuenta_id) throw new Error('Selecciona la cuenta');
  if (!d.fecha) throw new Error('Indica la fecha');
  if (!d.importe) throw new Error('El importe no puede ser 0');
  if (isT && !d.cuenta_contraria_id) throw new Error('Indica la cuenta contraria de la transferencia');
  if (isT && d.cuenta_contraria_id === d.cuenta_id) throw new Error('Origen y destino no pueden ser la misma cuenta');
  const main = {
    cuenta_id: d.cuenta_id, fecha: d.fecha, concepto: d.concepto || '', notas: d.notas || null, importe: round2(d.importe), tipo: d.tipo,
    mes_imputacion: (isT ? ymOf(d.fecha) : (d.mes || ymOf(d.fecha))).slice(0, 7) + '-01',
    categoria_id: isT ? null : (d.categoria_id || null),
    subtipo_transferencia: isT ? (d.subtipo_transferencia || subtipoPorCuenta(cuentaById(d.importe < 0 ? d.cuenta_contraria_id : d.cuenta_id))) : null,
    cuenta_contraria_id: isT ? d.cuenta_contraria_id : null,
    transfer_id: isT ? ((orig && orig.transfer_id) || uuid()) : null
  };
  const counterpart = () => ({
    cuenta_id: main.cuenta_contraria_id, cuenta_contraria_id: main.cuenta_id, fecha: main.fecha, mes_imputacion: main.mes_imputacion,
    concepto: main.concepto, notas: main.notas, importe: -main.importe, tipo: 'transferencia', subtipo_transferencia: main.subtipo_transferencia,
    categoria_id: null, transfer_id: main.transfer_id
  });
  if (!orig) {
    const rows = [{ id: uuid(), origen: 'manual', ...main }];
    if (isT) rows.push({ id: uuid(), origen: 'manual', ...counterpart() });
    await DB.insert('movimientos', rows);
  } else {
    const other = orig.transfer_id ? S.movimientos.find(m => m.transfer_id === orig.transfer_id && m.id !== orig.id) : null;
    await DB.update('movimientos', orig.id, main);
    if (isT) { if (other) await DB.update('movimientos', other.id, counterpart()); else await DB.insert('movimientos', [{ id: uuid(), origen: 'manual', ...counterpart() }]); }
    else if (other) await DB.remove('movimientos', other.id);
  }
  await reloadTable('movimientos');
}

  const efectivo = S.cuentas.find(c => c.tipo === 'efectivo' && c.activa !== false);
  const principal = S.cuentas.find(c => c.tipo === 'corriente' && c.activa !== false);

    } else {

      if (st.tipo === 'ingreso') {
        const upd = () => { const f = m.el.querySelector('#q-fecha').value, v = parseNum(m.el.querySelector('#q-imp').value); if (f) m.el.querySelector('#q-mes').value = reglaNominaAplica(f, v) ? addMonths(ymOf(f), 1) : ymOf(f); };
        m.el.querySelector('#q-fecha').onchange = upd; m.el.querySelector('#q-imp').onchange = upd;
      } else { m.el.querySelector('#q-fecha').onchange = null; m.el.querySelector('#q-imp').onchange = null; }
    }

  m.el.querySelector('#q-form').addEventListener('submit', async e => {
    e.preventDefault();
    const v = parseNum(m.el.querySelector('#q-imp').value);
    if (!v || isNaN(v)) { toast('Introduce un importe válido', 'warn'); return; }
    const abs = Math.abs(v), fecha = m.el.querySelector('#q-fecha').value, concepto = m.el.querySelector('#q-concepto').value.trim();
    let d;
    if (st.tipo === 'transferencia') d = { tipo: 'transferencia', fecha, concepto: concepto || 'Transferencia interna', importe: -abs, cuenta_id: m.el.querySelector('#q-origen').value, cuenta_contraria_id: m.el.querySelector('#q-destino').value, subtipo_transferencia: m.el.querySelector('#q-sub').value };

  });

async function impReadFile(file) {
  const buf = await file.arrayBuffer();
  let wb;
  if (/\.(csv|txt)$/i.test(file.name)) {
    let text = new TextDecoder('utf-8').decode(buf);
    if (text.includes('�')) text = new TextDecoder('windows-1252').decode(buf);
    wb = XLSX.read(text, { type: 'string', raw: true });
  } else wb = XLSX.read(buf, { type: 'array', cellDates: false });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
  let h = rows.findIndex((r, i) => i < 40 && r.some(c => /fecha/i.test(String(c))) && r.some(c => /importe|cargo|abono|cantidad/i.test(String(c))));
  if (h < 0) h = 0;
  const width = Math.max(...rows.slice(h, h + 30).map(r => r.length), 1);
  const headers = Array.from({ length: width }, (_, i) => String((rows[h] || [])[i] ?? '').trim() || `Columna ${i + 1}`);
  const data = rows.slice(h + 1).filter(r => r.some(c => String(c).trim() !== ''));
  const sig = 'pf_map_' + normText(headers.join('|')).slice(0, 180);
  let map = null;
  try { map = JSON.parse(localStorage.getItem(sig) || 'null'); } catch (e) { map = null; }
  if (!map) {
    const H = headers.map(normText);
    const idx = (...tests) => { for (const t of tests) { const i = H.findIndex(t); if (i >= 0) return i; } return -1; };
    map = {
      fecha: idx(x => x === 'fecha', x => x.includes('fecha') && x.includes('operac'), x => x.includes('fecha') && !x.includes('valor'), x => x.includes('fecha')),
      concepto: idx(x => x === 'concepto', x => x.includes('concepto'), x => x.includes('descrip'), x => x.includes('movimiento')),
      anot: idx(x => x.includes('anotac'), x => x.includes('observ'), x => x.includes('comentario'), x => x.includes('nota')),
      importe: idx(x => x === 'importe', x => x.includes('importe') && !x.includes('saldo'), x => x.includes('cantidad')),
      cargo: idx(x => x.includes('cargo') || x === 'debe'),
      abono: idx(x => x.includes('abono') || x === 'haber')
    };
    if (map.anot === map.concepto) map.anot = -1;
  }
  S.importData = { stage: 'map', cuentaId: S.importCuenta, fileName: file.name, headers, data, map, sig, headerRow: h };
}
function buildLearned(cuentaId) {
  const L = new Map();
  const sorted = S.movimientos.filter(m => m.cuenta_id === cuentaId).sort((a, b) => a.fecha < b.fecha ? -1 : 1);
  for (const m of sorted) {
    if (m.tipo !== 'transferencia' && !m.categoria_id) continue;
    if (m.tipo === 'transferencia' && !m.cuenta_contraria_id) continue;
    const v = { tipo: m.tipo, categoria_id: m.categoria_id, cuenta_contraria_id: m.cuenta_contraria_id, subtipo: m.subtipo_transferencia };
    for (const k of [normConcept(m.concepto), normConcept(m.notas)]) if (k && k.length >= 4) L.set(k, v);
  }
  return L;
}
const KW_TRANSF = /traspaso|transferencia|aportacion|ahorro|inversion|propia/;
const STOP = new Set(['cuenta', 'principal', 'inversion', 'fondo', 'ahorro', 'para', 'desde']);
function detectarCuentaContraria(t, cuentaId) {
  if (/cajero|reintegro|retirada de efectivo|disposicion.*efectivo|retirada efectivo/.test(t)) {
    const e = S.cuentas.find(c => c.tipo === 'efectivo' && c.id !== cuentaId && c.activa !== false); if (e) return e;
  }
  const tn = t.replace(/\s/g, '');
  let best = null, bs = 0;
  for (const c of S.cuentas) {
    if (c.id === cuentaId || c.activa === false) continue;
    let s = 0;
    const ent = normText(c.entidad).replace(/\s/g, '');
    if (ent.length > 3 && tn.includes(ent)) s += 2;
    for (const w of normText(c.nombre).split(' ').filter(w => w.length > 3 && !STOP.has(w))) if (t.includes(w)) s += 1;
    if (s > 0 && KW_TRANSF.test(t)) s += 1;
    if (s > bs) { bs = s; best = c; }
  }
  return bs >= 2 ? best : null;
}
function sugerir(concepto, cOrig, imp, cuentaId, learned) {
  const L = learned.get(normConcept(concepto)) || (cOrig ? learned.get(normConcept(cOrig)) : null);
  if (L && L.cuenta_contraria_id !== cuentaId) return { ...L, learned: true };
  const t = normText(`${concepto} ${cOrig}`);
  const cc = detectarCuentaContraria(t, cuentaId);
  if (cc) return { tipo: 'transferencia', cuenta_contraria_id: cc.id, subtipo: subtipoPorCuenta(cc), categoria_id: null };
  if (imp > 0) {
    const nom = /nomina|haberes|salario|sueldo|paga extra/.test(t) ? S.categorias.find(c => c.tipo === 'ingreso' && normText(c.nombre) === 'nomina') : null;
    return { tipo: 'ingreso', categoria_id: nom ? nom.id : null };
  }

}
function impProcess() {
  const D = S.importData; const { map, data, cuentaId } = D;
  if (map.fecha < 0) { toast('Indica la columna de fecha', 'warn'); return; }
  if (map.importe < 0 && map.cargo < 0 && map.abono < 0) { toast('Indica la columna de importe (o cargo/abono)', 'warn'); return; }
  try { localStorage.setItem(D.sig, JSON.stringify(map)); } catch (e) { /* noop */ }
  const learned = buildLearned(cuentaId);
  const existing = new Set(S.movimientos.filter(m => m.cuenta_id === cuentaId && m.hash_import).map(m => m.hash_import));
  const soft = S.movimientos.filter(m => m.cuenta_id === cuentaId && !m.hash_import);
  const occ = {}; const items = [];
  for (const r of data) {
    const fecha = parseDateAny(r[map.fecha]); if (!fecha) continue;
    let imp = map.importe >= 0 ? parseNum(r[map.importe]) : null;
    if ((imp === null || isNaN(imp)) && (map.cargo >= 0 || map.abono >= 0)) {
      const c = map.cargo >= 0 ? num(r[map.cargo]) : 0, a = map.abono >= 0 ? num(r[map.abono]) : 0;
      imp = Math.abs(a) - Math.abs(c);
    }
    if (imp === null || isNaN(imp) || imp === 0) continue;
    imp = round2(imp);
    const cOrig = map.concepto >= 0 ? String(r[map.concepto] ?? '').trim() : '';
    const anot = map.anot >= 0 ? String(r[map.anot] ?? '').trim() : '';
    const concepto = anot || cOrig || '(sin concepto)';
    const key = `${fecha}|${imp.toFixed(2)}|${normConcept(cOrig || anot)}`;
    occ[key] = (occ[key] || 0) + 1;
    const hash = `${cuentaId}|${key}#${occ[key]}`;
    const dup = existing.has(hash);
    const posibleDup = !dup && soft.some(m => m.fecha === fecha && round2(num(m.importe)) === imp);
    const sg = sugerir(concepto, cOrig, imp, cuentaId, learned);
    let mes = ymOf(fecha), nomina = false;
    if (sg.tipo === 'ingreso' && reglaNominaAplica(fecha, imp)) { mes = addMonths(mes, 1); nomina = true; }
    items.push({
      sel: !dup && !posibleDup, fecha, importe: imp, concepto, notas: (anot && cOrig && anot !== cOrig) ? cOrig : null,
      tipo: sg.tipo, categoria_id: sg.categoria_id || null, cuenta_contraria_id: sg.cuenta_contraria_id || null,
      subtipo: sg.subtipo || 'liquidez', mes, nomina, dup, posibleDup, hash, learned: !!sg.learned, key: normConcept(concepto)
    });
  }
  if (!items.length) { toast('No se encontraron movimientos válidos. Revisa las columnas.', 'warn'); return; }

  D.items = items; D.stage = 'preview';
  renderImport();
}
function onImpChange(el) {
  const D = S.importData; if (!D || !D.items) return;
  const i = +el.dataset.i, f = el.dataset.imp, it = D.items[i]; if (!it) return;
  if (f === 'sel') it.sel = el.checked;

    it.tipo = el.value; it.learned = false;

}
async function impSave(btn) {
  const D = S.importData; const sel = D.items.filter(x => x.sel);

/* =====================================================================
   9b. DASHBOARD · ALERTAS Y CONSEJOS

const apVal = v => (v.aportado_neto === null || v.aportado_neto === undefined) ? (cuentaById(v.cuenta_id) ? Calc.aportadoA(cuentaById(v.cuenta_id), v.fecha) : 0) : num(v.aportado_neto);
const median = arr => { if (!arr.length) return 0; const a = [...arr].sort((x, y) => x - y), m = Math.floor(a.length / 2); return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
/** Medias mensuales de los N meses completos anteriores a refYm que tengan datos. */
function mediaHistorica(refYm, n = 6) {
  const ms = Array.from({ length: n }, (_, i) => addMonths(refYm, -(i + 1)))
    .filter(m => S.movimientos.some(x => ymOf(x.mes_imputacion) === m && (x.tipo === 'gasto' || x.tipo === 'ingreso')));
  if (!ms.length) return null;
  const st = periodStats(ms);
  const porRaiz = {};
  for (const m of st.movs) if (m.tipo === 'gasto') { const r = rootOf(catById(m.categoria_id)); const k = r ? r.id : '_none'; porRaiz[k] = (porRaiz[k] || 0) - num(m.importe); }
  Object.keys(porRaiz).forEach(k => { porRaiz[k] /= ms.length; });

}
function buildAlertas(months, st, P, rows) {

  const today = todayISO(), curYm = ymOf(today), [cy, cm, cd] = today.split('-').map(Number);
  const nM = months.length, enCurso = months.includes(curYm), soloMesActual = nM === 1 && months[0] === curYm;
  const frac = cd / daysInMonth(cy, cm);
  const hist = mediaHistorica(months[0], 6);
  const gastoMes = (hist && hist.gastos > 0) ? hist.gastos : (st.gastos / nM);
  const ingMes = (hist && hist.ingresos > 0) ? hist.ingresos : (st.ingresos / nM);

  // 1) Presupuestos (la proyección solo se aplica a categorías con varios gastos, no a recibos únicos como la hipoteca)
  const nMovsCat = id => st.movs.filter(m => m.tipo === 'gasto' && m.categoria_id && (m.categoria_id === id || (catById(m.categoria_id) || {}).parent_id === id)).length;
  for (const r of rows) {
    if (!(r.bud > 0) || !r.own) continue;
    const pc = r.spent / r.bud;
    if (pc > 1) add('red', '🚨', `Presupuesto superado: ${r.nombre}`, `Has gastado ${fmtEUR(r.spent)} de ${fmtEUR(r.bud)} (${fmtPct(pc, 0)}). Te has pasado <b>${fmtEUR(r.spent - r.bud)}</b>.`);
    else if (soloMesActual && cd >= 7 && frac < 0.97 && r.spent / frac > r.bud * 1.05 && nMovsCat(r.catId) >= 3)
      add('amber', '⚠️', `${r.nombre}: a este ritmo te pasarás`, `Llevas ${fmtEUR(r.spent)} (${fmtPct(pc, 0)}) a día ${cd}. Proyección a fin de mes: <b>${fmtEUR(r.spent / frac)}</b> frente a ${fmtEUR(r.bud)}.`);
    else if (pc >= 0.85) add('amber', '⚠️', `${r.nombre} cerca del límite`, `Has consumido el ${fmtPct(pc, 0)} del presupuesto. Quedan ${fmtEUR(r.bud - r.spent)}.`);
  }

  // 2) Gastos extraordinarios (importe alto y muy por encima de lo habitual en su categoría)
  const umbral = num(S.ajustes.extra_umbral) || 300;
  const desde = addMonths(months[0], -12);
  const previos = S.movimientos.filter(m => m.tipo === 'gasto' && ymOf(m.mes_imputacion) >= desde && ymOf(m.mes_imputacion) < months[0]);
  const extras = st.movs.filter(m => m.tipo === 'gasto' && -num(m.importe) >= umbral).filter(m => {
    const h = previos.filter(x => x.categoria_id === m.categoria_id).map(x => -num(x.importe));
    return h.length >= 2 ? -num(m.importe) > 2.5 * median(h) : -num(m.importe) >= 3 * umbral;
  }).sort((a, b) => num(a.importe) - num(b.importe));
  if (extras.length) add('amber', '💥', `${extras.length} gasto(s) extraordinario(s): ${fmtEUR(-sum(extras, 'importe'))}`,
    `Importes muy por encima de lo habitual en su categoría:<ul>${extras.slice(0, 5).map(m => `<li>${fmtDate(m.fecha)} · ${esc(m.concepto || '—')} · <b>${fmtEUR(-num(m.importe))}</b> <span class="muted">(${esc(catName(m.categoria_id) || 'Sin categoría')})</span></li>`).join('')}</ul>${extras.length > 5 ? '…y ' + (extras.length - 5) + ' más.' : ''} Si son puntuales (seguro anual, reparación…), valora crear una partida de “gastos anuales” y provisionar cada mes 1/12.`);

  // 3) Categorías disparadas frente a tu media
  if (hist && hist.n >= 2) {
    const actual = {};
    for (const m of st.movs) if (m.tipo === 'gasto') { const r = rootOf(catById(m.categoria_id)); const k = r ? r.id : '_none'; actual[k] = (actual[k] || 0) - num(m.importe) / nM; }
    const subidas = Object.entries(actual).map(([k, v]) => ({ k, v, med: hist.porRaiz[k] || 0 }))
      .filter(o => o.med > 0 && o.v > o.med * 1.4 && (o.v - o.med) * nM > 100).sort((a, b) => (b.v - b.med) - (a.v - a.med)).slice(0, 3);
    for (const o of subidas) { const c = catById(o.k); add('amber', '📈', `${c ? c.nombre : 'Sin categoría'}: +${fmtPct(o.v / o.med - 1, 0)} sobre tu media`, `Gastas ${fmtEUR(o.v)}/mes frente a ${fmtEUR(o.med)}/mes de media en los ${hist.n} meses anteriores${enCurso ? ' (y el mes aún no ha terminado)' : ''}.`); }
  }

  // 4) Capacidad de ahorro
  if (st.ingresos > 0) {
    const t = st.ahorro / st.ingresos;
    if (st.ahorro < 0) add('red', '🔻', 'Gastas más de lo que ingresas', `Déficit de <b>${fmtEUR(-st.ahorro)}</b> en el periodo. Revisa primero las categorías con presupuesto superado y los gastos extraordinarios.`);
    else if (t < 0.1) add('amber', '🐷', `Tasa de ahorro baja: ${fmtPct(t)}`, `Una referencia sana es ahorrar al menos el 15-20 % de los ingresos. Recortar ${fmtEUR(st.ingresos * 0.15 - st.ahorro)} en el periodo te llevaría al 15 %.`);
    else if (t >= 0.3) add('green', '🏆', `Excelente tasa de ahorro: ${fmtPct(t)}`, `Estás ahorrando ${fmtEUR(st.ahorro)}. Asegúrate de que ese dinero se mueve a ahorro o inversión y no se queda parado en la cuenta corriente.`);
  } else if (st.gastos > 0 && !enCurso) add('blue', 'ℹ️', 'Sin ingresos imputados en el periodo', 'Comprueba que las nóminas están imputadas al mes correcto (regla de nómina, botón ⏭ en movimientos).');

  // 5) Fondo de emergencia
  const obj = num(S.ajustes.fondo_meses) || 6;

    else if (meses < obj) add('amber', '🛟', `Fondo de emergencia: ${fmtNum(meses, 1)} de ${obj} meses`, `Te faltan ${fmtEUR(objetivo - P.reserva, 0)} para tu objetivo. Con ${fmtEUR((objetivo - P.reserva) / 6, 0)}/mes lo completarías en 6 meses.`);
    else if (meses > obj * 1.5) add('blue', '💡', `Fondo de emergencia sobredimensionado: ${fmtNum(meses, 1)} meses`, `Tienes unos <b>${fmtEUR(P.reserva - objetivo, 0)}</b> por encima de tu objetivo de ${obj} meses. Ese excedente podría trabajar a largo plazo en tu cartera de inversión.`);
    else add('green', '🛟', `Fondo de emergencia completo: ${fmtNum(meses, 1)} meses`, 'Tu colchón cubre el objetivo. A partir de aquí, el ahorro puede ir a inversión.');

    // 6) Dinero ocioso en cuenta corriente/efectivo

    if (movido < st.ahorro * 0.5) add('blue', '🧭', 'El ahorro se queda en la cuenta corriente', `Has ahorrado ${fmtEUR(st.ahorro)} pero solo has movido ${fmtEUR(Math.max(0, movido))} a ahorro o inversión. Programa una transferencia automática el día después de cobrar la nómina (“págate primero”).`);
    if (ti < 0.1 && P.reserva / (gastoMes || 1) >= 3) add('blue', '📊', `Tasa de inversión del ${fmtPct(ti)}`, `Con tu ahorro medio, una aportación periódica de unos <b>${fmtEUR(Math.max(50, Math.round(((hist ? hist.ahorro : st.ahorro / nM) * 0.5) / 10) * 10), 0)}/mes</b> (la mitad de lo que ahorras) haría crecer el patrimonio de forma constante.`);
    else if (ti >= 0.15) add('green', '📈', `Buena tasa de inversión: ${fmtPct(ti)}`, `Inviertes ${fmtEUR(st.aport.inversion)} en el periodo. La constancia mensual es lo que más pesa a largo plazo.`);
  }

    else if (tin < 2) add('blue', '🏦', `${d.nombre}: TIN bajo (${fmtNum(tin, 2)} %)`, 'Con un interés tan bajo, amortizar anticipadamente suele aportar menos que mantener liquidez o invertir a largo plazo. Prioriza fondo de emergencia e inversión periódica.');

  if (susc && hist && hist.porRaiz[susc.id] > 0) add('blue', '🔁', `Suscripciones: ${fmtEUR(hist.porRaiz[susc.id] * 12, 0)}/año`, 'Revisa una vez al trimestre cuáles usas de verdad. Es el ahorro más fácil: se cancela una vez y se nota todos los meses.');

function simular(d) {
  const I = deudaInfo(d), extra = Math.abs(num($('#sim-' + d.id).value)), out = $('#simres-' + d.id);
  if (!extra) { out.innerHTML = ''; return; }
  if (extra >= I.pendienteHoy) { out.innerHTML = `<div class="banner blue">Con ${fmtEUR(extra)} cancelarías el préstamo por completo y te ahorrarías ${fmtEUR(I.interesesPendientes)} en intereses.</div>`; return; }
  const P = I.pendienteHoy - extra, start = addMonths(ymOf(todayISO()), 1);
  const s1 = amortizar(P, I.r, I.cuota, start) || [];
  const ahorroPlazo = I.interesesPendientes - sum(s1, 'interes');
  const nuevaCuota = cuotaFrancesa(P, I.r, I.restantes);
  const s2 = amortizar(P, I.r, nuevaCuota, start) || [];
  const ahorroCuota = I.interesesPendientes - sum(s2, 'interes');
  out.innerHTML = `<div class="grid-2e">
    <div class="metric"><div class="l"><b>Reducir plazo</b> (misma cuota)</div><div class="v pos">−${I.restantes - s1.length} meses</div><div class="small">Ahorro intereses: <b class="pos">${fmtEUR(ahorroPlazo)}</b> · Fin: ${s1.length ? ymLabel(s1[s1.length - 1].ym) : '—'}</div></div>
    <div class="metric"><div class="l"><b>Reducir cuota</b> (mismo plazo)</div><div class="v pos">${fmtEUR(nuevaCuota)}/mes</div><div class="small">−${fmtEUR(I.cuota - nuevaCuota)}/mes · Ahorro intereses: <b class="pos">${fmtEUR(ahorroCuota)}</b></div></div></div>`;
}

  const P = Calc.patrimonio();

  const r = await withSaving(btn, async () => { if (prev) await DB.update('snapshots', prev.id, row); else await DB.insert('snapshots', [row]); await reloadTable('snapshots'); }, `Foto Q${trimestre} ${anio} guardada ✓`);

  { name: 'tipo', label: 'Tipo', type: 'select', options: [{ v: 'corriente', l: 'Corriente (operativa)' }, { v: 'ahorro', l: 'Ahorro / fondo de emergencia' }, { v: 'efectivo', l: 'Efectivo' }, { v: 'inversion', l: 'Inversión' }] },
  { name: 'color', label: 'Color', type: 'color' },
  { name: 'saldo_inicial', label: 'Saldo de partida (€)', type: 'number', hint: 'Saldo real a cierre del día indicado' }, { name: 'fecha_saldo_inicial', label: 'Fecha del saldo', type: 'date' },
  { name: 'orden', label: 'Orden', type: 'int' }, { name: 'activa', label: 'Cuenta activa', type: 'checkbox', def: true }
];
async function saveEntity(table, id, vals) {
  if (id) await DB.update(table, id, vals); else await DB.insert(table, [vals]);
  await reloadTable(table);
}
const zeroNulls = (v, keys) => { keys.forEach(k => { if (v[k] === null) v[k] = 0; }); return v; };

/* =====================================================================
   17. ACCIONES (delegación de eventos)
   ===================================================================== */
const Actions = {
  tab: el => { S.tab = el.dataset.tab; history.replaceState(null, '', '#' + S.tab); render(); window.scrollTo({ top: 0 }); },
  refresh: () => loadAll(),
  'period-mode': el => { S.period.mode = el.dataset.mode; render(); },
  'period-shift': el => { const d = +el.dataset.d; S.period.ref = addMonths(S.period.ref, S.period.mode === 'anio' ? d * 12 : d); render(); },
  'quick-open': el => openQuick(el.dataset.tipo || 'gasto', { destino: el.dataset.destino }),

  'cuenta-new': () => openForm({ title: 'Nueva cuenta', fields: FIELDS_CUENTA, values: { tipo: 'corriente', fecha_saldo_inicial: todayISO(), orden: S.cuentas.length + 1, activa: true, color: PALETTE[S.cuentas.length % PALETTE.length] },
    onSubmit: v => saveEntity('cuentas', null, zeroNulls({ ...v, fecha_saldo_inicial: v.fecha_saldo_inicial || todayISO() }, ['saldo_inicial', 'orden'])) }),
  'cuenta-edit': el => { const c = cuentaById(el.dataset.id); openForm({ title: 'Editar cuenta', fields: FIELDS_CUENTA, values: c, onSubmit: v => saveEntity('cuentas', c.id, zeroNulls({ ...v, fecha_saldo_inicial: v.fecha_saldo_inicial || todayISO() }, ['saldo_inicial', 'orden'])) }); },
  'cuenta-del': async el => {
    const c = cuentaById(el.dataset.id); const n = S.movimientos.filter(m => m.cuenta_id === c.id).length;
    if (!(await confirmDlg(`¿Eliminar la cuenta <b>${esc(c.nombre)}</b>?<br>Se borrarán también sus <b>${n} movimientos</b>. Si solo quieres ocultarla, edítala y desmarca “Cuenta activa”.`, 'Eliminar'))) return;
    await withSaving(null, async () => { await DB.remove('cuentas', c.id); await Promise.all([reloadTable('cuentas'), reloadTable('movimientos')]); }, 'Cuenta eliminada'); render();
  },
  'cuenta-conciliar': el => {
    const c = cuentaById(el.dataset.id);
    openForm({ title: `Conciliar saldo · ${c.nombre}`, intro: `<p class="small muted">Saldo calculado ahora: <b>${fmtEUR(Calc.saldo(c))}</b>. Introduce el saldo real que ves en el banco (o el efectivo contado) tras los movimientos de la fecha indicada. Los movimientos posteriores seguirán sumando.</p>`,
      fields: [{ name: 'saldo', label: 'Saldo real (€)', type: 'number', required: true }, { name: 'fecha', label: 'A cierre del día', type: 'date' }], values: { saldo: Calc.saldo(c), fecha: todayISO() },
      onSubmit: v => saveEntity('cuentas', c.id, { saldo_inicial: v.saldo, fecha_saldo_inicial: v.fecha || todayISO() }) });
  },
  'cuenta-valor': el => {
    const c = cuentaById(el.dataset.id);
    openForm({ title: `Valor de mercado · ${c.nombre}`, intro: `<p class="small muted">Introduce el valor total actual de la cartera (lo que muestra ${esc(c.entidad || 'el bróker')}). Las aportaciones posteriores a esta fecha se sumarán automáticamente.</p>`,
      fields: [{ name: 'valor', label: 'Valor actual (€)', type: 'number', required: true }, { name: 'fecha', label: 'Fecha', type: 'date' }], values: { valor: Calc.valor(c), fecha: todayISO() },
      onSubmit: async v => {
        const fecha = v.fecha || todayISO();
        await saveEntity('cuentas', c.id, { valor_mercado: v.valor, fecha_valor_mercado: fecha });
        if (S.tablaValoraciones) { await DB.insert('valoraciones', [{ cuenta_id: c.id, fecha, valor: v.valor, aportado_neto: Calc.aportadoA(c, fecha) }]); await reloadTable('valoraciones'); }
      } });
  },
  'inv-new': () => openForm({ title: 'Nueva cuenta de inversión', fields: FIELDS_CUENTA, values: { tipo: 'inversion', fecha_saldo_inicial: todayISO(), orden: S.cuentas.length + 1, activa: true, color: PALETTE[S.cuentas.length % PALETTE.length] },
    onSubmit: v => saveEntity('cuentas', null, zeroNulls({ ...v, fecha_saldo_inicial: v.fecha_saldo_inicial || todayISO() }, ['saldo_inicial', 'orden'])) }),
  'inv-aportado': el => {
    const c = cuentaById(el.dataset.id);
    openForm({ title: `Capital aportado · ${c.nombre}`, intro: '<p class="small muted">Total que has aportado de tu bolsillo a esta cuenta (aportaciones − retiradas) hasta la fecha indicada. Las aportaciones que registres después como transferencias se sumarán solas.</p>',
      fields: [{ name: 'saldo', label: 'Capital aportado neto (€)', type: 'number', required: true }, { name: 'fecha', label: 'Hasta el día', type: 'date' }], values: { saldo: Calc.saldo(c), fecha: todayISO() },
      onSubmit: v => saveEntity('cuentas', c.id, { saldo_inicial: v.saldo, fecha_saldo_inicial: v.fecha || todayISO() }) });
  },
  'val-del': async el => {
    const v = S.valoraciones.find(x => x.id === el.dataset.id); if (!v) return;
    if (!(await confirmDlg(`¿Eliminar la valoración del ${fmtDate(v.fecha)} (${fmtEUR(v.valor)}) del histórico?`, 'Eliminar'))) return;
    await withSaving(null, async () => { await DB.remove('valoraciones', v.id); await reloadTable('valoraciones'); }, 'Valoración eliminada'); render();
  },
  'alert-more': el => { const box = $('#alert-more'); if (box) { box.hidden = !box.hidden; el.textContent = box.hidden ? el.dataset.more : 'Ver menos'; } },
  'cfg-save-alertas': async el => {
    const extra_umbral = num($('#cfg-extra').value) || 300, fondo_meses = num($('#cfg-fondo').value) || 6;
    const r = await withSaving(el, () => DB.upsert('ajustes', { clave: 'alertas', valor: { extra_umbral, fondo_meses }, updated_at: new Date().toISOString() }, 'clave'), 'Ajustes de alertas guardados ✓');
    if (r !== FAIL) { S.ajustes.extra_umbral = extra_umbral; S.ajustes.fondo_meses = fondo_meses; render(); }
  },

  'mov-edit': el => { const m = S.movimientos.find(x => x.id === el.dataset.id); if (m) openMovEdit(m); },
  'mov-del': async el => {
    const m = S.movimientos.find(x => x.id === el.dataset.id); if (!m) return;
    if (!(await confirmDlg(`¿Eliminar “${esc(m.concepto || '')}” (${fmtEUR(num(m.importe))})?${m.transfer_id ? '<br>Se eliminará también la otra pata de la transferencia.' : ''}`, 'Eliminar'))) return;
    await withSaving(null, async () => { if (m.transfer_id) await DB.removeWhere('movimientos', 'transfer_id', m.transfer_id); else await DB.remove('movimientos', m.id); await reloadTable('movimientos'); }, 'Movimiento eliminado');
    render();
  },
  'mov-imput': async el => {
    const m = S.movimientos.find(x => x.id === el.dataset.id); if (!m) return;
    const nuevo = ymOf(m.mes_imputacion) === ymOf(m.fecha) ? addMonths(ymOf(m.fecha), 1) : ymOf(m.fecha);
    const r = await withSaving(null, async () => { await DB.update('movimientos', m.id, { mes_imputacion: nuevo + '-01' }); m.mes_imputacion = nuevo + '-01'; }, `Imputado a ${ymLabel(nuevo)}`);
    if (r !== FAIL) renderMovList();
  },
  'mov-regla': async el => {
    const cands = S.movimientos.filter(m => m.tipo === 'ingreso' && ymOf(m.mes_imputacion) === ymOf(m.fecha) && reglaNominaAplica(m.fecha, m.importe));
    if (!cands.length) { toast('No hay ingresos pendientes de aplicar la regla', 'ok'); return; }
    if (!(await confirmDlg(`Se imputarán al mes siguiente <b>${cands.length}</b> ingreso(s) cobrados en los últimos ${S.ajustes.nomina_dias} días laborables del mes con importe ≥ ${fmtEUR(S.ajustes.nomina_umbral)}:<br><br><span class="small">${cands.slice(0, 8).map(m => `${fmtDate(m.fecha)} · ${esc(m.concepto)} · ${fmtEUR(num(m.importe))}`).join('<br>')}${cands.length > 8 ? '<br>…' : ''}</span>`, 'Aplicar', false))) return;
    await withSaving(el, async () => {
      for (let i = 0; i < cands.length; i += 10) await Promise.all(cands.slice(i, i + 10).map(m => DB.update('movimientos', m.id, { mes_imputacion: addMonths(ymOf(m.fecha), 1) + '-01' })));
      await reloadTable('movimientos');
    }, 'Regla de nómina aplicada ✓', 'Aplicando…');
    render();
  },
  'mov-allmonths': () => { S.movFilter.mes = ''; S.movLimit = 150; renderCuentas(); },
  'mov-more': () => { S.movLimit += 300; renderMovList(); },

  'imp-cancel': () => { S.importData = null; renderImport(); },
  'imp-back': () => { S.importData.stage = 'map'; renderImport(); },
  'imp-process': () => impProcess(),
  'imp-selall': el => { S.importData.items.forEach(x => { x.sel = el.dataset.v === '1'; }); renderImport(); },
  'imp-save': el => impSave(el),

  'cat-new': el => openCatForm(null, el.dataset.tipo, el.dataset.parent),
  'cat-edit': el => openCatForm(catById(el.dataset.id)),
  'cat-del': async el => {
    const c = catById(el.dataset.id); const ids = [c.id, ...childrenOf(c.id).map(x => x.id)];
    const n = S.movimientos.filter(m => ids.includes(m.categoria_id)).length;
    if (!(await confirmDlg(`¿Eliminar <b>${esc(c.nombre)}</b>${ids.length > 1 ? ` y sus ${ids.length - 1} subcategorías` : ''}?<br>${n} movimiento(s) quedarán sin categoría.`, 'Eliminar'))) return;
    await withSaving(null, async () => { await DB.remove('categorias', c.id); await Promise.all([reloadTable('categorias'), reloadTable('movimientos')]); }, 'Categoría eliminada'); render();
  },

  'inm-new': () => openForm({ title: 'Nuevo inmueble', fields: FIELDS_INM, values: {}, onSubmit: v => saveEntity('inmuebles', null, v) }),
  'inm-edit': el => { const i = S.inmuebles.find(x => x.id === el.dataset.id); openForm({ title: 'Editar inmueble', fields: FIELDS_INM, values: i, onSubmit: v => saveEntity('inmuebles', i.id, v) }); },
  'inm-del': async el => { const i = S.inmuebles.find(x => x.id === el.dataset.id); if (!(await confirmDlg(`¿Eliminar <b>${esc(i.nombre)}</b>?`, 'Eliminar'))) return; await withSaving(null, async () => { await DB.remove('inmuebles', i.id); await Promise.all([reloadTable('inmuebles'), reloadTable('deudas')]); }, 'Eliminado'); render(); },
  'veh-new': () => openForm({ title: 'Nuevo vehículo', fields: FIELDS_VEH, values: { tipo: 'coche' }, onSubmit: v => saveEntity('vehiculos', null, v) }),
  'veh-edit': el => { const v0 = S.vehiculos.find(x => x.id === el.dataset.id); openForm({ title: 'Editar vehículo', fields: FIELDS_VEH, values: v0, onSubmit: v => saveEntity('vehiculos', v0.id, v) }); },
  'veh-del': async el => { const v = S.vehiculos.find(x => x.id === el.dataset.id); if (!(await confirmDlg(`¿Eliminar <b>${esc(v.nombre)}</b>?`, 'Eliminar'))) return; await withSaving(null, async () => { await DB.remove('vehiculos', v.id); await reloadTable('vehiculos'); }, 'Eliminado'); render(); },
  'deu-new': () => openForm({ title: 'Nuevo préstamo', fields: FIELDS_DEUDA, values: { tipo: 'prestamo_personal', tipo_interes: 'fijo', activa: true, fecha_capital_pendiente: todayISO() }, onSubmit: v => saveEntity('deudas', null, { ...v, inmueble_id: v.inmueble_id || null }) }),
  'deu-edit': el => { const d = S.deudas.find(x => x.id === el.dataset.id); openForm({ title: 'Editar préstamo', fields: FIELDS_DEUDA, values: d, onSubmit: v => saveEntity('deudas', d.id, { ...v, inmueble_id: v.inmueble_id || null }) }); },
  'deu-del': async el => { const d = S.deudas.find(x => x.id === el.dataset.id); if (!(await confirmDlg(`¿Eliminar <b>${esc(d.nombre)}</b>?`, 'Eliminar'))) return; await withSaving(null, async () => { await DB.remove('deudas', d.id); await reloadTable('deudas'); }, 'Eliminado'); render(); },
  'deu-pend': el => {
    const d = S.deudas.find(x => x.id === el.dataset.id);
    openForm({ title: `Capital pendiente · ${d.nombre}`, intro: '<p class="small muted">Copia el capital pendiente del último recibo o de la app del banco. Entre actualizaciones, la app lo estima descontando la parte de capital de cada cuota.</p>',
      fields: [{ name: 'capital_pendiente', label: 'Capital pendiente (€)', type: 'number', required: true }, { name: 'fecha_capital_pendiente', label: 'A fecha de', type: 'date' }, { name: 'interes', label: 'TIN vigente (%)', type: 'number' }, { name: 'cuota_mensual', label: 'Cuota mensual (€)', type: 'number' }],
      values: { capital_pendiente: deudaInfo(d).pendienteHoy, fecha_capital_pendiente: todayISO(), interes: d.interes, cuota_mensual: d.cuota_mensual },
      onSubmit: v => saveEntity('deudas', d.id, { ...v, fecha_capital_pendiente: v.fecha_capital_pendiente || todayISO() }) });
  },
  'deu-sim': el => { _deudaCache = new Map(); simular(S.deudas.find(x => x.id === el.dataset.id)); },

  'snap-save': el => snapSave(el),
  'snap-del': async el => { const s = S.snapshots.find(x => x.id === el.dataset.id); if (!(await confirmDlg(`¿Eliminar la foto de <b>Q${s.trimestre} ${s.anio}</b>?`, 'Eliminar'))) return; await withSaving(null, async () => { await DB.remove('snapshots', s.id); await reloadTable('snapshots'); }, 'Eliminada'); render(); },

  'cfg-save-conn': async () => {
    const url = $('#cfg-url').value.trim().replace(/\/+$/, ''), key = $('#cfg-key').value.trim();
    if (!/^https:\/\/.+/.test(url) || !key) { toast('Introduce una URL https válida y la clave', 'warn'); return; }
    localStorage.setItem('pf_sb_url', url); localStorage.setItem('pf_sb_key', key);
    await loadAll();
    if (S.connected) { toast('Conectado a Supabase ✓', 'ok'); S.tab = 'dashboard'; render(); }
  },
  'cfg-clear': async () => { if (!(await confirmDlg('¿Borrar la URL y la clave guardadas en este dispositivo?', 'Olvidar'))) return; localStorage.removeItem('pf_sb_url'); localStorage.removeItem('pf_sb_key'); S.connected = false; setConn('', 'Sin configurar'); render(); },
  'cfg-save-regla': async el => {
    const dias = parseInt($('#cfg-dias').value, 10) || 5, umbral = num($('#cfg-umbral').value);
    const r = await withSaving(el, () => DB.upsert('ajustes', { clave: 'regla_nomina', valor: { dias, umbral }, updated_at: new Date().toISOString() }, 'clave'), 'Regla guardada ✓');
    if (r !== FAIL) { S.ajustes.nomina_dias = dias; S.ajustes.nomina_umbral = umbral; render(); }
  },
  'cfg-export': () => exportJSON()
};

const Changes = {
  'p-ref': el => { if (el.value) { S.period.ref = el.value; render(); } },
  'p-from': el => { if (el.value) { S.period.from = el.value; render(); } },
  'p-to': el => { if (el.value) { S.period.to = el.value; render(); } },
  'mf-mes': el => { S.movFilter.mes = el.value; S.movLimit = 150; renderMovList(); },
  'mf-cuenta': el => { S.movFilter.cuenta = el.value; S.movLimit = 150; renderMovList(); },
  'mf-tipo': el => { S.movFilter.tipo = el.value; S.movLimit = 150; renderMovList(); },
  'imp-cuenta': el => { S.importCuenta = el.value; },
  'imp-file': async el => {
    const f = el.files && el.files[0]; if (!f) return;
    if (!window.XLSX) { toast('No se pudo cargar la librería de Excel (¿sin conexión?)', 'err'); return; }
    S.importCuenta = $('#imp-cuenta').value;
    if (!S.importCuenta) { toast('Selecciona la cuenta del extracto', 'warn'); return; }
    loading(true, 'Leyendo archivo…');
    try { await impReadFile(f); } catch (e) { console.error(e); toast('No se pudo leer el archivo: ' + e.message, 'err'); }
    finally { loading(false); renderImport(); }
  }
};

function bindEvents() {
  document.addEventListener('click', async e => {
    const t = e.target.closest('[data-action]'); if (!t || t.disabled) return;
    const fn = Actions[t.dataset.action]; if (!fn) return;
    e.preventDefault();
    try { await fn(t, e); } catch (err) { console.error(err); toast(err.message || String(err), 'err'); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset && t.dataset.imp !== undefined) return onImpChange(t);
    if (t.dataset && t.dataset.map !== undefined) { S.importData.map[t.dataset.map] = parseInt(t.value, 10); return; }
    const h = Changes[t.id]; if (h) h(t);
  });
  document.addEventListener('input', debounce(e => { if (e.target.id === 'mf-q') { S.movFilter.q = e.target.value; S.movLimit = 150; renderMovList(); } }, 250));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { const x = $$('.modal-x').pop(); if (x) x.click(); } });
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h) && h !== S.tab) { S.tab = h; render(); } });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (S.tab === 'dashboard') render(); }, 400); });
}

/* =====================================================================
   18. ARRANQUE
   ===================================================================== */
(function boot() {
  const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) S.tab = h;
  setupChartDefaults();
  bindEvents();
  if (!window.supabase) toast('No se pudo cargar la librería de Supabase. Revisa tu conexión.', 'err', 6000);
  if (!getConn().url) { S.tab = 'ajustes'; setConn('', 'Sin configurar'); render(); return; }
  loadAll();
})();
</script>
</body>
</html>
