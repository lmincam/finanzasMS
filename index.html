<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1f3a">
<script>try{var t=localStorage.getItem('pf_tema');if(t&&t!=='auto')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patrimonio MS">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Patrimonio Miñán Sánchez · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="css/estilos.css?v=5.29.2">
</head>
<body>
<div class="sticky">
  <header class="topbar">
    <div class="logo">€</div>
    <div class="brand">Patrimonio Miñán Sánchez <span class="brand-ver" id="app-version"></span></div>
    <div class="sp"></div>
    <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-txt">Sin conectar</span></div>
    <button class="icon-btn" data-action="refresh" title="Recargar datos" aria-label="Recargar datos"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button class="user-chip" id="user-chip" data-action="tab" data-tab="ajustes" title="Sesión y ajustes" aria-label="Ajustes">·</button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
  <div id="offline-bar" hidden></div>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Secciones"></nav>

<!-- Menú lateral de secciones (móvil) -->
<div id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-back" data-action="menu-close"></div>
  <nav class="drawer-panel" aria-label="Secciones">
    <div class="drawer-head"><div class="logo">€</div><div class="brand">Patrimonio Miñán Sánchez<small id="drawer-version"></small></div>
      <button class="drawer-x" data-action="menu-close" aria-label="Cerrar menú">×</button></div>
    <div id="drawer-list"></div>
    <div class="drawer-foot"><button class="btn success" data-action="quick-open" data-tipo="gasto" style="width:100%;justify-content:center">+ Registrar movimiento</button></div>
  </nav>
</div>

<main id="main">
  <nav class="subtabs" id="subtabs" hidden aria-label="Apartados"></nav>
  <section class="tab" id="tab-dashboard"></section>
  <section class="tab" id="tab-cuentas"></section>
  <section class="tab" id="tab-planificacion"></section>
  <section class="tab" id="tab-patrimonio"></section>
  <section class="tab" id="tab-inversiones"></section>
  <section class="tab" id="tab-inmuebles"></section>
  <section class="tab" id="tab-vehiculos"></section>
  <section class="tab" id="tab-pertenencias"></section>
  <section class="tab" id="tab-notas"></section>
  <section class="tab" id="tab-deudas"></section>
  <section class="tab" id="tab-seguros"></section>
  <section class="tab" id="tab-futuro"></section>
  <section class="tab" id="tab-auditoria"></section>
  <section class="tab" id="tab-categorias"></section>
  <section class="tab" id="tab-ajustes"></section>
</main>

<button class="fab" data-action="quick-open" data-tipo="gasto" title="Registro rápido">+</button>
<div id="modal-root"></div>
<div id="toasts"></div>
<div id="loader" class="loader hidden"><div class="spinner"></div><div id="loader-txt">Cargando…</div></div>
